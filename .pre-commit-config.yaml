# pip install pre-commit && pre-commit install
# Runs ruff (lint + import order) on every commit, same config as CI (pyproject.toml).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(aegis_core|command_center)/
