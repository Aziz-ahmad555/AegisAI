{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2>Live Vision</h2>
    <div class="desc">Real-time object detection, tracking, and fire/smoke recognition streamed directly from camera.</div>
</div>

<style>
    .vision-layout { display: flex; gap: 18px; }
    #video-panel { flex: 3; }
    #video-panel img { width: 100%; border-radius: 4px; background: #000; display: block; }
    #controls-panel { flex: 1; }
    .panel-label { color: var(--text-dim); font-size: 0.82em; margin-bottom: 8px; font-weight: 500; }
    .mode-btn {
        display: block; width: 100%; margin: 4px 0; padding: 10px;
        background: var(--panel-raised); color: var(--text); border: 1px solid var(--line);
        border-radius: 4px; cursor: pointer; font-size: 0.88em; text-align: left;
        font-family: 'IBM Plex Sans', sans-serif;
    }
    .mode-btn:hover { border-color: var(--amber); }
    .mode-btn.active { background: var(--amber); border-color: var(--amber); color: #1a1305; font-weight: 600; }
    .mode-desc { color: var(--text-faint); font-size: 0.8em; margin-top: 14px; line-height: 1.55; }
    .status-line {
        margin-top: 14px; padding: 10px; background: var(--base); border: 1px solid var(--line);
        border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 0.8em; color: var(--cyan);
    }
</style>

<div class="vision-layout">
    <div id="video-panel" class="card">
        <img id="video-stream" src="{{ url_for('video_feed') }}" alt="Live vision feed">
    </div>

    <div id="controls-panel" class="card">
        <div class="panel-label">Detection mode</div>
        <button class="mode-btn active" data-mode="tracking" onclick="setMode('tracking')">Object detection &amp; tracking</button>
        <button class="mode-btn" data-mode="fire_smoke" onclick="setMode('fire_smoke')">Fire / smoke detection</button>
        <button class="mode-btn" data-mode="fall_detection" onclick="setMode('fall_detection')">Fall detection (pose)</button>

        <div class="mode-desc" id="mode-description">
            YOLOv8n with multi-object tracking - assigns persistent IDs to detected objects across frames.
        </div>

        <div class="status-line" id="status-line">Loading...</div>
    </div>
</div>

<script>
    var descriptions = {
        "tracking": "YOLOv8n with multi-object tracking - assigns persistent IDs to detected objects across frames.",
        "fire_smoke": "Custom-trained YOLOv8n model (mAP50 0.576) detecting fire and smoke in real time.",
        "fall_detection": "YOLOv8n-pose keypoint detection with confidence-filtered geometry to flag possible falls."
    };

    function setMode(mode) {
        fetch("/api/vision_mode", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode: mode })
        }).then(function() {
            document.querySelectorAll(".mode-btn").forEach(function(btn) {
                btn.classList.toggle("active", btn.dataset.mode === mode);
            });
            document.getElementById("mode-description").innerText = descriptions[mode];
        });
    }

    function pollStatus() {
        fetch("/api/vision_info")
            .then(function(res) { return res.json(); })
            .then(function(data) {
                document.getElementById("status-line").innerText = data.detail || "Running";
            })
            .catch(function() {});
    }

    setInterval(pollStatus, 1000);
    pollStatus();
</script>
{% endblock %}
