{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2>Live Vision</h2>
    <p>Real-time detection from the local camera. In fire/smoke mode, detections feed the fused sensor risk for the monitored zone.</p>
</div>

<div class="grid grid-main-side">
    <section class="card card-tight" aria-labelledby="feed-title">
        <h3 class="card-title" id="feed-title">Camera feed <span class="hint">zone: {{ camera_zone }}</span></h3>
        <img class="video-frame" id="video-stream" src="{{ url_for('video_feed') }}" alt="Live camera feed with detection overlays">
    </section>

    <div class="stack">
        <section class="card card-tight" aria-labelledby="mode-title">
            <h3 class="card-title" id="mode-title">Detection mode</h3>
            <div class="btn-list mode-list" role="radiogroup" aria-label="Detection mode">
                <button class="btn active" data-mode="tracking" role="radio" aria-checked="true">Object detection &amp; tracking</button>
                <button class="btn" data-mode="fire_smoke" role="radio" aria-checked="false">Fire / smoke detection</button>
                <button class="btn" data-mode="fall_detection" role="radio" aria-checked="false">Fall detection (pose)</button>
            </div>
            <p class="dim" id="mode-description" style="font-size: 14px; margin: var(--s3) 0 0;"></p>
            <div class="status-line" id="status-line" aria-live="polite">Starting camera&hellip;</div>
        </section>
    </div>
</div>

<script>
(function () {
    var descriptions = {
        tracking: "YOLOv8n with multi-object tracking - persistent IDs for detected objects across frames.",
        fire_smoke: "Custom-trained YOLOv8n (mAP50 0.576) detecting fire and smoke; confidence feeds sensor fusion.",
        fall_detection: "YOLOv8n-pose keypoints with confidence-filtered geometry to flag possible falls."
    };
    var buttons = document.querySelectorAll(".mode-list .btn");

    function show(mode) {
        buttons.forEach(function (b) {
            var on = b.dataset.mode === mode;
            b.classList.toggle("active", on);
            b.setAttribute("aria-checked", on ? "true" : "false");
        });
        document.getElementById("mode-description").textContent = descriptions[mode];
    }

    buttons.forEach(function (b) {
        b.onclick = function () {
            fetch("/api/vision_mode", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mode: b.dataset.mode })
            }).then(function (r) { if (r.ok) show(b.dataset.mode); });
        };
    });

    function poll() {
        fetch("/api/vision_info").then(function (r) { return r.json(); }).then(function (d) {
            var line = d.detail || "Running";
            if (d.fps) line += "  ·  " + d.fps.toFixed(1) + " fps  ·  " + d.latency_ms + " ms";
            if (d.mode && descriptions[d.mode]) show(d.mode);      // reflect the camera's actual mode
            document.getElementById("status-line").textContent = line;
        }).catch(function () {
            document.getElementById("status-line").textContent = "Status unavailable - is the server running?";
        });
    }
    show("tracking");
    setInterval(poll, 1000);
    poll();
})();
</script>
{% endblock %}
