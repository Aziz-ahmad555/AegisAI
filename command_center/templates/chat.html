{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2>Command Chat</h2>
    <div class="desc">Natural-language interface over live system state, coordinating fire, medical and routing specialists.</div>
</div>

<style>
    .chat-status {
        display: inline-flex; align-items: center; gap: 7px;
        padding: 4px 12px; border-radius: 3px; font-size: 0.78em;
        margin-bottom: 18px; font-family: 'IBM Plex Mono', monospace;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-connected { background: #16281d; color: var(--green); }
    .status-connected .status-dot { background: var(--green); }
    .status-offline { background: #2e2308; color: var(--amber); }
    .status-offline .status-dot { background: var(--amber); }

    #chat-window { height: 400px; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 4px; font-size: 0.9em; line-height: 1.55; white-space: pre-wrap; }
    .msg-operator { align-self: flex-end; background: var(--amber); color: #1a1305; }
    .msg-coordinator { align-self: flex-start; background: var(--panel-raised); color: var(--text); border: 1px solid var(--line); }
    .msg-meta { font-size: 0.7em; color: var(--text-faint); margin-top: 5px; font-family: 'IBM Plex Mono', monospace; }
    #chat-input-row { display: flex; gap: 8px; margin-top: 14px; }
    #chat-input {
        flex: 1; padding: 10px; background: var(--base); color: var(--text);
        border: 1px solid var(--line); border-radius: 4px; font-size: 0.92em; font-family: 'IBM Plex Sans', sans-serif;
    }
    #chat-input:focus { outline: none; border-color: var(--amber); }
    #chat-send { padding: 10px 20px; background: var(--amber); color: #1a1305; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    #chat-send:hover { background: #f0ad4f; }
    .panel-label { color: var(--text-dim); font-size: 0.82em; margin-bottom: 8px; font-weight: 500; }
    .suggested {
        display: block; width: 100%; text-align: left; margin: 3px 0; padding: 8px 10px;
        background: var(--panel-raised); color: var(--text-faint); border: 1px solid var(--line);
        border-radius: 4px; cursor: pointer; font-size: 0.8em; font-family: 'IBM Plex Sans', sans-serif;
    }
    .suggested:hover { color: var(--text); border-color: var(--amber); }
</style>

<div class="chat-status {{ 'status-connected' if llm_status == 'connected' else 'status-offline' }}">
    <span class="status-dot"></span>
    {% if llm_status == 'connected' %}Connected &middot; Claude{% else %}Offline &middot; keyword routing{% endif %}
</div>

<div style="display: flex; gap: 18px;">
    <div class="card" style="flex: 3;">
        <div id="chat-window"></div>
        <div id="chat-input-row">
            <input type="text" id="chat-input" placeholder="Ask about the current situation..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="chat-send" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="card" style="flex: 1;">
        <div class="panel-label">Suggested</div>
        <button class="suggested" onclick="askSuggested('Is there a fire right now?')">Is there a fire right now?</button>
        <button class="suggested" onclick="askSuggested('How many people need rescue?')">How many people need rescue?</button>
        <button class="suggested" onclick="askSuggested('Can people evacuate safely?')">Can people evacuate safely?</button>
        <button class="suggested" onclick="askSuggested('What is the full situation right now?')">Full situation summary</button>
    </div>
</div>

<script>
    function appendMessage(text, sender, meta) {
        var win = document.getElementById("chat-window");
        var msg = document.createElement("div");
        msg.className = "msg " + (sender === "operator" ? "msg-operator" : "msg-coordinator");
        msg.innerText = text;
        if (meta) {
            var metaDiv = document.createElement("div");
            metaDiv.className = "msg-meta";
            metaDiv.innerText = meta;
            msg.appendChild(metaDiv);
        }
        win.appendChild(msg);
        win.scrollTop = win.scrollHeight;
    }

    function askSuggested(text) {
        document.getElementById("chat-input").value = text;
        sendMessage();
    }

    function sendMessage() {
        var input = document.getElementById("chat-input");
        var question = input.value.trim();
        if (!question) return;

        appendMessage(question, "operator");
        input.value = "";

        appendMessage("...", "coordinator");
        var win = document.getElementById("chat-window");
        var thinkingMsg = win.lastChild;

        fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: question })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            win.removeChild(thinkingMsg);
            appendMessage(data.answer, "coordinator", data.mode);
        })
        .catch(function() {
            win.removeChild(thinkingMsg);
            appendMessage("Error contacting the coordinator.", "coordinator");
        });
    }

    appendMessage("Ready. Ask about active incidents, evacuation status, or medical needs.", "coordinator");
</script>
{% endblock %}
