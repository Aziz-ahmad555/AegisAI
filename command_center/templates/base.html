<!DOCTYPE html>
<html>
<head>
    <title>Aegis Command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --base: #0b0d10;
            --panel: #14171b;
            --panel-raised: #191d22;
            --line: #262b31;
            --text: #e8e6e1;
            --text-dim: #8a8f96;
            --text-faint: #565c64;
            --amber: #e8a33d;
            --amber-dim: #7a5a25;
            --green: #4caf6d;
            --red: #e5484d;
            --cyan: #4fa8d8;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--base);
            color: var(--text);
            font-family: 'IBM Plex Sans', Arial, sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            font-size: 15px;
        }
        .mono { font-family: 'IBM Plex Mono', monospace; }

        #sidebar {
            width: 228px;
            background: var(--panel);
            border-right: 1px solid var(--line);
            flex-shrink: 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        #sidebar .brand {
            padding: 22px 22px 18px 22px;
        }
        #sidebar .brand .mark {
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }
        #sidebar .brand .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 8px var(--amber);
        }
        #sidebar .brand h1 {
            font-size: 1.08em;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.01em;
        }
        #sidebar .brand .sub {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68em;
            color: var(--text-faint);
            margin-top: 6px;
            letter-spacing: 0.03em;
        }
        #sidebar nav {
            padding: 6px 0 16px 0;
            border-top: 1px solid var(--line);
        }
        #sidebar nav a {
            display: block;
            padding: 9px 22px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.92em;
            border-left: 2px solid transparent;
        }
        #sidebar nav a:hover {
            color: var(--text);
            background: var(--panel-raised);
        }
        #sidebar nav a.active {
            color: var(--amber);
            border-left: 2px solid var(--amber);
            background: var(--panel-raised);
        }
        #sidebar .foot {
            margin-top: auto;
            padding: 14px 22px 18px 22px;
            border-top: 1px solid var(--line);
        }
        #sidebar .foot a {
            color: var(--text-faint);
            font-size: 0.8em;
            text-decoration: none;
        }
        #sidebar .foot a:hover { color: var(--text-dim); }

        #main {
            margin-left: 228px;
            flex: 1;
            padding: 30px 40px 60px 40px;
            max-width: calc(100vw - 228px);
        }
        .page-header { margin-bottom: 26px; }
        .page-header h2 {
            margin: 0 0 6px 0;
            font-size: 1.5em;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        .page-header .desc {
            color: var(--text-dim);
            font-size: 0.94em;
            max-width: 640px;
            line-height: 1.5;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 18px;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="brand">
            <div class="mark">
                <span class="dot"></span>
                <h1>Aegis</h1>
            </div>
            <div class="sub">EMERGENCY INTELLIGENCE</div>
        </div>
        <nav>
            <a href="/" class="nav-link">Overview</a>
            <a href="/vision" class="nav-link">Live Vision</a>
            <a href="/sensors" class="nav-link">Sensor Fusion</a>
            <a href="/twin" class="nav-link">Digital Twin</a>
            <a href="/aerial" class="nav-link">Aerial Search</a>
            <a href="/nlp" class="nav-link">Report Analyzer</a>
            <a href="/chat" class="nav-link">Command Chat</a>
        </nav>
        <div class="foot">
            <a href="/logout">Sign out</a>
        </div>
    </div>

    <div id="main">
        {% block content %}{% endblock %}
    </div>

    <script>
        var path = window.location.pathname;
        document.querySelectorAll(".nav-link").forEach(function(link) {
            if (link.getAttribute("href") === path) {
                link.classList.add("active");
            }
        });
    </script>
</body>
</html>
