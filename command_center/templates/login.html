<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emergency Nexus - Sign in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/aegis.css') }}">
</head>
<body>
<main class="login-page">
    <section class="card login-box" aria-labelledby="login-title">
        <div class="brand-mark"><span class="brand-dot"></span><h1 id="login-title" style="margin: 0; font-size: var(--fs-lg);">Emergency Nexus</h1></div>
        <div class="brand-sub">AI COMMAND CENTER</div>

        <form method="POST" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="lbl" for="username">Username</label>
                <input class="field" type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div>
                <label class="lbl" for="password">Password</label>
                <input class="field" type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            {% if error %}<div class="notice notice-warn" role="alert">{{ error }}</div>{% endif %}
            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>

        {% if show_default_login %}
        <p class="faint" style="font-size: 13px; margin: var(--s4) 0 0;">Local demo login: <span class="mono">operator / aegisai2026</span>. Set <span class="mono">AEGISAI_PASSWORD_HASH</span> to use your own password.</p>
        {% endif %}
    </section>
</main>
</body>
</html>
