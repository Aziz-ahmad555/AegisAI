# Render blueprint: New + > Blueprint > pick this repo. Free web service,
# built from the Dockerfile. You'll be asked for the two secret values below.
services:
  - type: web
    name: aegisai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: AEGISAI_SECRET_KEY
        generateValue: true          # random value generated by Render
      - key: AEGISAI_PASSWORD_HASH   # output of the one-line hash command in the README
        sync: false
      - key: GROQ_API_KEY            # optional - chat falls back to offline routing without it
        sync: false
      - key: AEGISAI_USERNAME
        value: operator
