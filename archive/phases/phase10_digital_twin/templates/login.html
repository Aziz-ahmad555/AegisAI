<!DOCTYPE html>
<html>
<head>
    <title>AegisAI - Login</title>
    <style>
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 32px;
            width: 320px;
        }
        h1 { color: #58a6ff; font-size: 1.4em; margin-top: 0; }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            background: #1f6feb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover { background: #388bfd; }
        .error { color: #f85149; font-size: 0.9em; margin-top: 8px; }
        .note { color: #8b949e; font-size: 0.8em; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>AegisAI Command Center</h1>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="note">Default: operator / aegisai2026 (set AEGISAI_USERNAME / AEGISAI_PASSWORD env vars to change)</div>
    </div>
</body>
</html>
